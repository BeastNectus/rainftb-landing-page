<section id="community" class="border-b border-white/10 bg-[#090d19] py-16 sm:py-20 lg:py-24">
    <div class="section-shell">
        <div class="max-w-3xl">
            <p class="eyebrow">Collector confidence</p>
            <h2 class="section-title mt-3">Trusted by creators and bidders</h2>
            <p class="muted-copy mt-3">The marketplace experience is built around clarity, speed, and visible proof points for every drop.</p>
        </div>

        <div class="mt-10 grid gap-5 lg:grid-cols-3">
            <article *ngFor="let info of infos" class="premium-surface rounded-2xl bg-[#12141d] p-6 backdrop-blur-none">
                <div class="flex items-start justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <img [src]="info.img" [alt]="info.name + ' avatar'" class="h-12 w-12 rounded-full border border-white/15 bg-white object-cover" />
                        <div>
                            <h3 class="font-display text-lg font-bold text-white">{{ info.name }}</h3>
                            <p class="text-sm text-slate-400">{{ info.role }}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 rounded-full border border-white/10 bg-white/[0.06] px-3 py-1.5">
                        <img src="assets/img/star.svg" alt="" class="h-4 w-4" aria-hidden="true" />
                        <span class="text-sm font-bold text-white">{{ info.rating }}</span>
                    </div>
                </div>
                <p class="mt-6 text-sm leading-7 text-slate-200">"{{ info.description }}"</p>
            </article>
        </div>
    </div>
</section>
