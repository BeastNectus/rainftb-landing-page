<header class="sticky top-0 z-50 border-b border-white/10 bg-[#07080d]/80 backdrop-blur-xl">
    <nav class="section-shell flex min-h-[76px] items-center justify-between" aria-label="Primary navigation">
        <a
            href="#marketplace"
            class="group flex items-center gap-3 focus:outline-none focus:ring-2 focus:ring-cyan-200 focus:ring-offset-2 focus:ring-offset-slate-950"
            (click)="closeMenu()">
            <span class="grid h-10 w-10 place-items-center rounded-xl border border-cyan-200/40 bg-cyan-200 text-sm font-black text-slate-950 shadow-lg shadow-cyan-500/20">R</span>
            <span class="font-display text-xl font-bold tracking-normal text-white">RAINFTB</span>
        </a>

        <div class="hidden items-center gap-8 lg:flex">
            <a
                *ngFor="let item of navItems"
                [href]="item.href"
                class="text-sm font-semibold text-slate-300 transition hover:text-white focus:outline-none focus:ring-2 focus:ring-cyan-200 focus:ring-offset-2 focus:ring-offset-slate-950">
                {{ item.label }}
            </a>
        </div>

        <div class="hidden items-center gap-3 lg:flex">
            <a href="#auctions" class="secondary-action px-4">Explore</a>
            <button type="button" class="primary-action">Connect Wallet</button>
        </div>

        <button
            type="button"
            class="mobile-menu-button inline-flex h-11 w-11 items-center justify-center rounded-xl border border-white/10 bg-white/[0.06] text-white transition hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-cyan-200 focus:ring-offset-2 focus:ring-offset-slate-950 lg:hidden"
            [attr.aria-expanded]="menuOpen"
            aria-controls="mobile-navigation"
            aria-label="Toggle navigation menu"
            (click)="toggleMenu()">
            <svg *ngIf="!menuOpen" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
            </svg>
            <svg *ngIf="menuOpen" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" />
            </svg>
        </button>
    </nav>

    <div
        id="mobile-navigation"
        *ngIf="menuOpen"
        class="border-t border-white/10 bg-[#090d19]/95 px-5 py-5 shadow-2xl shadow-black/30 backdrop-blur-xl lg:hidden">
        <div class="mx-auto flex max-w-7xl flex-col gap-2">
            <a
                *ngFor="let item of navItems"
                [href]="item.href"
                class="rounded-xl px-3 py-3 text-base font-semibold text-slate-200 transition hover:bg-white/[0.07] hover:text-white focus:outline-none focus:ring-2 focus:ring-cyan-200"
                (click)="closeMenu()">
                {{ item.label }}
            </a>
            <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
                <a href="#auctions" class="secondary-action w-full" (click)="closeMenu()">Explore</a>
                <button type="button" class="primary-action w-full" (click)="closeMenu()">Connect Wallet</button>
            </div>
        </div>
    </div>
</header>
