<footer class="bg-[#07080d]">
    <div class="section-shell py-12 sm:py-16">
        <div class="grid gap-10 lg:grid-cols-[1.05fr_1.95fr]">
            <div>
                <a href="#marketplace" class="inline-flex items-center gap-3 focus:outline-none focus:ring-2 focus:ring-cyan-200 focus:ring-offset-2 focus:ring-offset-slate-950">
                    <span class="grid h-10 w-10 place-items-center rounded-xl border border-cyan-200/40 bg-cyan-200 text-sm font-black text-slate-950">R</span>
                    <span class="font-display text-xl font-bold text-white">RAINFTB</span>
                </a>
                <p class="muted-copy mt-5 max-w-sm">
                    A premium NFT marketplace for discovering verified drops, following high-signal creators, and bidding with confidence.
                </p>
                <div class="mt-6 flex flex-col gap-2 sm:flex-row">
                    <a href="#auctions" class="secondary-action min-h-10 px-4 py-2">Explore</a>
                    <button type="button" class="primary-action min-h-10 px-4 py-2">Connect Wallet</button>
                </div>
            </div>

            <div class="grid gap-8 sm:grid-cols-2 lg:grid-cols-4">
                <div *ngFor="let link of links">
                    <h2 class="text-sm font-bold uppercase tracking-[0.18em] text-white">{{ link.title }}</h2>
                    <div class="mt-4 flex flex-col gap-3">
                        <a
                            *ngFor="let section of link.section"
                            href="#marketplace"
                            class="text-sm text-slate-400 transition hover:text-white focus:outline-none focus:ring-2 focus:ring-cyan-200 focus:ring-offset-2 focus:ring-offset-slate-950">
                            {{ section.label }}
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-12 flex flex-col gap-3 border-t border-white/10 pt-6 text-sm text-slate-500 sm:flex-row sm:items-center sm:justify-between">
            <p>Copyright 2026 RAINFTB. All rights reserved.</p>
            <p>Built for creators, collectors, and culture.</p>
        </div>
    </div>
</footer>
